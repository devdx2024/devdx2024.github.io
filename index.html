<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155e75">
  <meta name="description" content="Exemplo de aplicativo web que funciona offline.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Notas Offline</title>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">EXEMPLO DE PWA</div>
      <h1>Notas Offline</h1>
      <p>Suas anotações ficam salvas neste dispositivo.</p>
      <div id="status" class="status">Verificando conexão…</div>
    </header>

    <form id="note-form">
      <label for="note">Nova anotação</label>
      <textarea id="note" rows="3" maxlength="3000" placeholder="Escreva algo…" required></textarea>
      <button type="submit">Salvar anotação</button>
    </form>

    <section aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">Anotações</h2>
        <span id="count">0 itens</span>
      </div>
      <p id="empty" class="empty">Nenhuma anotação ainda. Crie a primeira acima.</p>
      <ul id="notes" class="notes"></ul>
    </section>
    <footer>Demo local • Não envia seus dados para um servidor</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
